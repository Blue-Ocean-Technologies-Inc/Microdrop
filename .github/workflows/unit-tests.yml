name: Unit tests

# Runs the pure-unit pytest partition only: tests/ subpackages next to the
# code, and examples/tests/. The Redis-need and hardware-need partitions
# (tests_with_redis_server_need/, tests_with_dropbot_connection_need/) are
# excluded via --ignore-glob, not just left unselected — merely COLLECTING
# tests_with_redis_server_need/conftest.py runs module-level code that swaps
# the global dramatiq broker to a RedisBroker for the rest of the session,
# which corrupts every other test that expects the default StubBroker. See
# AGENTS.md "Testing" for the partition layout.
#
# The pixi manifest and lockfile live in the launcher repo
# (Blue-Ocean-Technologies-Inc/pixi-microdrop, public), under microdrop-py/,
# with this repo checked out as the microdrop-py/src submodule. So this job
# checks the launcher repo out first, then overlays the PR's/pushed commit
# of this repo at microdrop-py/src, before handing that manifest to
# prefix-dev/setup-pixi.
#
# Platform note: the manifest locks osx-arm64, win-64, and linux-aarch64
# only -- there is no linux-64 entry, so plain `ubuntu-latest` (x86_64)
# cannot install this environment. We run on ubuntu-24.04-arm (GitHub's
# hosted arm64 Linux runner, free for public repos) to match the locked
# linux-aarch64 platform instead of silently reworking the manifest.
#
# Known-failing baseline: this selection currently has 139 failing tests and
# 3 collection errors out of 1363 (verified locally on main @ a3f32b9a,
# win-64, before this workflow existed -- not introduced by this change).
# Most cluster in pluggable_protocol_tree/tests (103) and
# video_protocol_controls/tests (13). The step below runs with
# continue-on-error so the job stays green on merge while those pre-existing
# failures stay visible as an annotated warning in the run -- fixing them is
# tracked as a follow-up, not silently swallowed here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pure-unit pytest partition
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Check out launcher repo (pixi manifest + lockfile)
        uses: actions/checkout@v4
        with:
          repository: Blue-Ocean-Technologies-Inc/pixi-microdrop
          path: launcher

      - name: Check out this commit at microdrop-py/src
        uses: actions/checkout@v4
        with:
          path: launcher/microdrop-py/src

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: launcher/microdrop-py/pyproject.toml
          locked: true
          cache: true

      - name: Run pure-unit pytest partition
        working-directory: launcher/microdrop-py/src
        env:
          QT_QPA_PLATFORM: offscreen
        # continue-on-error: see "Known-failing baseline" above -- remove
        # once the pre-existing failures are fixed or explicitly deselected.
        continue-on-error: true
        run: |
          pixi run --manifest-path ../pyproject.toml python -m pytest . -q \
            --ignore-glob="**/tests_with_redis_server_need" \
            --ignore-glob="**/tests_with_dropbot_connection_need"
