# This file is generated from the pixi-microdrop manifest (microdrop-py/pyproject.toml),
# which is the source of truth for the environment. Create it with:
#   conda env create -f environment.yml
# For the full supported setup (optional plugins, dev tools), use the pixi-microdrop launcher.

name: microdrop

channels:
  - conda-forge
  - alexsk
  - vignesh229
  - https://prefix.dev/microdrop-plugins

dependencies:
  - python >=3.11
  - apptools >=5.3.1,<6
  - dramatiq >=2.2.0,<3
  - dropbot >=1.74.4,<2
  - envisage >=8.0.1,<9
  - ffmpeg >=8.0.1,<10
  - pyface >=8.0.0,<9
  - pydantic >=2.13.4,<3
  - redis-py >=6.4.0,<7
  - apscheduler >=3.11.3,<4
  - tqdm >=4.70.0,<5
  - svg.path >=7.1,<8
  - plotly >=6.9.0,<7
  - paramiko >=5.0.0,<6
  - shapely >=2.1.2,<3
  - traits >=7.1.0,<8
  - traitsui >=8.0.0,<9
  - mr-box-peripheral-board >=0.31.9,<0.32
  - pandas >=3.0.5,<4
  - setuptools >=79.0.0,<85
  # The pixi manifest pins redis-server per platform (Windows >=3.0.501,<4
  # from alexsk; Linux/macOS >=8.10.1,<9); unpinned here so one file solves
  # everywhere.
  - redis-server
  # Windows only — uncomment on Windows:
  # - ntfsutils >=0.1.5,<0.2
  # - libblas=*=*openblas  # OpenBLAS instead of the ~540 MB MKL default
  - pip
  - pip:
      - pyside6>=6.8.0.2,<7
      - dotenv>=0.9.9,<0.10
      - opencv-python-headless>=5.0.0.93,<6
      # The launcher's local path packages (microdrop_py itself and
      # pyside6-icu-preload) are not installable from here — run from src/
      # or use the pixi-microdrop launcher.

# Optional features from the pixi-microdrop manifest (see pyproject.toml):
# - plugins: magnet-microdrop-plugin >=1.2.0,<2
# - portable: dropbot-portable-ui >=1.0.0,<2, pyqtgraph >=0.14.0,<0.15
