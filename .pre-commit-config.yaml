# Local guardrails mirroring the CI gates. One-time setup per clone:
#   pre-commit install --hook-type commit-msg --hook-type pre-commit
repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.4
    hooks:
      - id: commitizen        # commit-msg: enforce Conventional Commits
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast         # staged .py files must parse
      - id: check-merge-conflict
      - id: check-added-large-files
        # 1500 admits shipped icon webfonts (the MDI webfont is ~1.3 MB;
        # firmware images are blocked by .gitignore, not by size)
        args: [--maxkb=1500]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Match the pixi manifest's ruff pin; runs on staged files only, so the
    # legacy codebase is brought clean incrementally as files are touched.
    rev: v0.16.4
    hooks:
      - id: ruff-check        # lint + import sorting (ruff.toml)
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        files: \.py$
        args: [--license-filepath, .copyright-header.txt, --comment-style, "#"]
  - repo: https://github.com/Blue-Ocean-Technologies-Inc/microdrop-dev-hooks
    rev: v0.1.0
    hooks:
      - id: stamp-import-sections
      - id: forbid-scratch-files
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (plugin decoupling contract)
        # Whole-graph check against .importlinter at the repo root; a single
        # touched file can introduce a new cross-plugin import anywhere in
        # the dependency chain, so it always runs rather than filtering by
        # the files pre-commit staged.
        entry: lint-imports
        language: python
        additional_dependencies: [import-linter==2.14]
        types: [python]
        pass_filenames: false
      - id: check-package-inits
        name: check-package-inits (no __init__.py-less package dirs)
        # grimp silently skips a directory with tracked .py files but no
        # __init__.py, so the import-linter contract above can't see imports
        # inside it. Whole-repo check, same reasoning as import-linter: a
        # staged file alone can't tell us whether some other directory in
        # the tree lost its __init__.py. Stdlib only; `language: python`
        # runs it on pre-commit's own interpreter, not whatever is on PATH.
        entry: python tools/check_package_inits.py
        language: python
        types: [python]
        pass_filenames: false
      - id: file-length-ratchet
        name: file-length-ratchet (god files may not grow, #615)
        # Staged-files-only, unlike the two whole-repo checks above: growth
        # is only detectable by comparing each staged file against its own
        # baseline entry in tools/file_length_baseline.json. Warning-only
        # for one release (see check_file_length_ratchet.py); flip to
        # blocking once the team has seen a cycle of its messages.
        entry: python tools/check_file_length_ratchet.py
        language: python
        types: [python]
